[package]
name = "fs_rs"
version = "0.5.2"
edition = "2024"
description = "A simple file system information tool written in Rust."
license = "MIT"
homepage = "https://github.com/akshaybabloo/fs_rs"
repository = "https://github.com/akshaybabloo/fs_rs"
keywords = ["file", "system", "information", "tool", "cli"]
authors = ["Akshay Raj Gollahalli <akshay@gollahalli.com>"]
readme = "README.md"
categories = ["command-line-utilities"]

#[[bin]]
#path = "src/main.rs"
#name = "fs"
#test = false

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
colored = "3.1.1"
comfy-table = "8.0.0"
humansize = "2.1.3"
rayon = "1.12.0"
spinoff = { version = "0.8.0", features = ["dots"] }
sysinfo = "0.39.6"
serde_json = "1.0.150"

[dev-dependencies]
tempfile = "3.27.0"
